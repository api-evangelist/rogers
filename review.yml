transports:
  - protocol: REST
    scheme: https
    documented: false
    note: >-
      Rogers Control Centre exposes a REST API to contracted customers. Endpoints are documented by
      Cisco on Cisco DevNet, not by Rogers, and require an API key plus a live tenant.
  - protocol: SOAP
    scheme: https
    documented: false
    note: Cisco IoT Control Center SOAP API, license-key authenticated, available to Control Centre Advantage tier customers.
  - protocol: Webhook
    scheme: https
    documented: false
    note: Cisco IoT Control Center PUSH API callbacks, validated with a shared secret. No Rogers-published event catalog.
  - protocol: GraphQL
    documented: false
    note: No GraphQL surface. /graphql returns 404 on both www.rogers.com and api.rogers.com.
  - protocol: gRPC
    documented: false
    note: No published .proto files.
  - protocol: WebSocket
    documented: false
    note: None documented.
