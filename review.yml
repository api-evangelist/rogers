actions:
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  reason: >-
    No parseable OpenAPI, Swagger, AsyncAPI, GraphQL SDL, or .proto artifact is published on any
    Rogers-owned host. Every spec path probed returned 404 and every developer subdomain failed DNS.
    Nothing was fabricated and no third-party specification was imported into this repository.
