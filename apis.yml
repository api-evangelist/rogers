apis:
- aid: rogers:rogers-control-centre-iot-api
  name: Rogers Control Centre IoT APIs
  description: >-
    Rogers Control Centre is Rogers' managed IoT and M2M connectivity management platform, a white-labelled
    deployment of Cisco IoT Control Center (formerly Jasper). Rogers' own product pages list "Access to
    applicable REST APIs" and "Access to applicable REST and SOAP APIs" as tier features, so the API surface
    is real and named by Rogers — but Rogers publishes no endpoint reference, no OpenAPI, and no sandbox of
    its own. The underlying REST, SOAP, and PUSH API functions are documented by Cisco on Cisco DevNet, and a
    live Rogers tenant requires an existing Rogers Business contract plus platform credentials. Authentication
    on the Cisco platform is an API key for REST and a license key for SOAP, with a shared secret used to
    validate incoming PUSH callbacks. Access is customer-gated; there is no self-serve signup.
  humanURL: https://www.rogers.com/business/iot/control-centre
  tags:
