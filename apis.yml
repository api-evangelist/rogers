name: Rogers Communications
kind: company
description: >-
  Rogers Communications is Canada's largest wireless carrier and, following its 2023 acquisition of Shaw
  Communications, one of the country's largest cable, internet, and media companies. It operates a national
  5G mobile network, broadband and TV services under the Rogers, Fido, chatr, and Shaw/Ignite brands, and
  owns Rogers Sports & Media. In the telecom API value chain Rogers sits squarely on the network-operator
  side, not the developer-facing side: it has no first-party developer portal, publishes no OpenAPI or
  Swagger definitions, runs no sandbox, and ships no first-party SDKs. Its legacy developer programme,
  Rogers Catalyst, is dead — www.rogers.com/developer still 301s to a meta-refresh page pointing at
  rogerscatalyst.com, a domain that no longer belongs to Rogers (re-registered through NameCheap with
  registrant privacy in December 2023) and that now serves a one-byte blank page. Rogers' network
  capabilities reach developers only through intermediaries: EnStream LP, the identity and fraud joint
  venture it co-owns with Bell Mobility and TELUS, which resells Canadian carrier Number Verification and
  SIM Swap data on a sales-led, contract-first basis with no public documentation; Aduna, the
  Ericsson-and-carrier joint venture that announced an EnStream partnership in February 2025 to bring
  Bell, Rogers, and TELUS network APIs onto a CAMARA-aligned platform; and, historically, a
  Canada-exclusive private preview of Microsoft's Azure Programmable Connectivity announced at MWC 2023,
  whose public documentation has since been retired. Rogers is partner-gated and reachable only through
  aggregators — the CAMARA posture is real but wholesale, and nothing is callable from a Rogers-owned
  domain.
